<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gym Content Manager</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <!-- Include the script that builds the page and powers Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    CMS.init({
      config: {
        backend: {
          name: "git-gateway",
          branch: "main"
        },
        media_folder: "images/uploads",
        public_folder: "/images/uploads",
        collections: [
          {
            name: "site_content",
            label: "Site Content",
            files: [
              {
                name: "content",
                label: "Trainers & Timetable",
                file: "content.json",
                fields: [
                  { label: "Gym Name", name: "gym_name", widget: "string" },
                  {
                    label: "Trainers",
                    name: "trainers",
                    widget: "list",
                    fields: [
                      { label: "Name", name: "name", widget: "string" },
                      { label: "Role", name: "role", widget: "string" },
                      { label: "Color Code (Hex)", name: "c", widget: "string", default: "#C6FF3D" },
                      { label: "Tags", name: "tags", widget: "list" }
                    ]
                  },
                  {
                    label: "Sessions",
                    name: "sessions",
                    widget: "list",
                    fields: [
                      { label: "Day (Mon, Tue, Wed, Thu, Fri, Sat)", name: "d", widget: "string" },
                      { label: "Time (e.g. 05:30)", name: "t", widget: "string" },
                      { label: "Session Name", name: "n", widget: "string" },
                      { label: "Trainer Name", name: "who", widget: "string" }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    });
  </script>
</body>
</html>
